<title>Mrs Eman's Alphabet World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Comic+Neue:wght@700&display=swap">
<style>

/* Layout: a garden "classroom door" – logo + guide girl on top, one card per alphabet map below, each with Learn and Play. Single bright look by choice. */
:root{
  --sky1:#4fb0ee; --sky2:#c4ecff; --ink:#4a2a6b; --cream:#fff8ec; --pink:#ff4f93; --pink-d:#d12d6f;
  --sun:#ffd23f; --sun-d:#e9a700; --mint:#3ccf7a; --mint-d:#1f9b55; --muted:#b9a9c9;
  --font:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --comic:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#5cbcf2}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--font);background:#5cbcf2;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px;
  position:relative;overflow-x:hidden;-webkit-user-select:none;user-select:none}
img{max-width:100%;-webkit-user-drag:none}

/* sky decorations */
.deco{position:absolute;inset:0 0 auto;height:100%;pointer-events:none;overflow:hidden}
.sun{position:absolute;right:-70px;top:-80px;width:330px;max-width:none}
.bf{position:absolute;width:130px;max-width:none}
.bf.b1{left:4%;top:260px;animation:fly1 16s ease-in-out infinite}
.bf.b2{right:6%;top:520px;width:110px;animation:fly2 19s ease-in-out infinite}
.bf.b3{left:46%;top:40px;width:96px;animation:fly3 13s ease-in-out infinite}
@keyframes fly1{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(160px,-90px) rotate(10deg)}50%{transform:translate(60px,120px)}75%{transform:translate(-40px,30px) rotate(-12deg)}}
@keyframes fly2{0%,100%{transform:translate(0,0) rotate(8deg)}30%{transform:translate(-180px,-120px) rotate(-10deg)}65%{transform:translate(-60px,140px) rotate(6deg)}}
@keyframes fly3{0%,100%{transform:translate(0,0)}50%{transform:translate(-220px,60px) rotate(-12deg)}}
.cloud{position:absolute;left:-280px;filter:drop-shadow(0 10px 12px rgba(180,120,200,.22))}
.cloud svg{display:block;width:100%;height:auto}
.cl1{top:120px;width:250px;animation:sail 60s linear infinite}
.cl2{top:330px;width:190px;animation:sail 75s linear infinite;animation-delay:-38s}
.cl3{top:30px;width:160px;animation:sail 68s linear infinite;animation-delay:-18s;opacity:.9}
.cl4{top:560px;width:150px;animation:sail 85s linear infinite;animation-delay:-60s;opacity:.85}
@keyframes sail{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 300px))}}
.meadow{position:fixed;left:0;right:0;bottom:0;height:190px;z-index:0;pointer-events:none;overflow:hidden}
.meadow .grass{position:absolute;left:50%;bottom:0;width:1652px;max-width:none;height:190px;transform:translateX(-50%);
  filter:drop-shadow(0 -3px 4px rgba(40,110,40,.25))}
.meadow .fl{position:absolute;max-width:none}

/* header */
header{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding-top:max(18px,env(safe-area-inset-top,0px));display:grid;grid-template-columns:auto 1fr;align-items:end;gap:10px}
.brand{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
.brand .lcloud{display:block;width:min(270px,38%);aspect-ratio:760/255;height:auto;object-fit:contain;flex:0 0 auto;max-width:none;filter:drop-shadow(0 8px 10px rgba(40,70,140,.22));animation:floaty 5.5s ease-in-out infinite}
.brand .lcloud:last-child{animation-delay:-2.7s}
.titlebtn{grid-column:1/-1;justify-self:center;border:0;background:none;padding:0;cursor:pointer;display:block}
.girltitle{width:min(680px,94vw);display:block;filter:drop-shadow(0 12px 18px rgba(80,40,120,.25));transform-origin:50% 80%}
.gwrap{position:relative;display:block;width:min(680px,94vw)}
.gwrap .girltitle{width:100%}
.tskin,.tmouth{position:absolute;left:46.582%;top:30.494%;width:5.808%;height:5.889%;max-width:none;pointer-events:none}
.tskin{opacity:0;transition:opacity .1s}.tskin.on{opacity:1}
.tmouth{transform-origin:50.00% 30%;will-change:transform}
.gwrap{animation:floaty 5s ease-in-out infinite}
@keyframes talk{to{transform:translateY(-5px) rotate(-1deg) scale(1.015)}}
.titlebtn:focus-visible{outline:5px solid #fff;outline-offset:4px;border-radius:30px}
/* cards: the teacher's cloud artwork, with its letters and buttons lifted out so they can move */
main{position:relative;z-index:2;max-width:1200px;margin:4px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px}
.card{position:relative;flex:0 0 auto;align-self:center;height:max-content;width:min(540px,calc(50% - 12px));filter:drop-shadow(0 0 2px #fff) drop-shadow(0 12px 14px rgba(70,40,120,.25));animation:floaty 4.6s ease-in-out infinite}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.card .base{display:block;width:100%;height:auto;max-width:none}
.card .lt{position:absolute;max-width:none;animation:hop 2.8s ease-in-out infinite;transform-origin:50% 90%}

.card .dash{position:absolute;border-radius:999px;background:linear-gradient(#fff 0 12%,var(--dc) 30%,color-mix(in srgb,var(--dc) 75%,#000) 100%);

.card a.cb:focus-visible{outline:4px solid #fff;outline-offset:3px}
.card .badge{position:absolute;left:8.4%;top:9.2%;width:15.4%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font:800 clamp(18px,5vw,30px)/1 var(--font);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 65%);border:5px solid #fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,#fff)}
.card .soon{position:absolute;left:18%;right:12%;top:30%;bottom:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;

.card.locked{width:min(300px,calc(33.3% - 16px))}

.brk{flex-basis:100%;height:0;margin-top:-10px}
.card.locked .base{filter:saturate(.55) brightness(1.03)}
.c3{--c:#2f8be6}.c4{--c:#2fbf6b}.c5{--c:#9b6bff}

/* animated meadow background (same scene as the games), fixed behind the page and scaled to cover the screen */
#bgwrap{position:fixed;left:0;right:0;top:-60px;bottom:-200px;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(#5cbcf2 0 50%,#7ac943 50%)}html{background:linear-gradient(#5cbcf2 0 50%,#7ac943 50%)}
#garden{position:absolute;left:50%;top:50%;width:1200px;height:800px;transform-origin:50% 50%}
#garden img{max-width:none}
#garden .plate3{position:absolute;left:0;top:-31px;width:1200px;height:831px}
#garden .bc{position:absolute;animation:cdrift ease-in-out infinite;opacity:.97}
@keyframes cdrift{0%{transform:translateX(-90px)}50%{transform:translateX(150px)}100%{transform:translateX(-90px)}}
#garden .bfl{position:absolute;transform-origin:50% 60%;animation:fsw ease-in-out infinite alternate}
@keyframes fsw{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(12deg) scale(1.08)}}
#garden .bf{position:absolute;width:52px;animation:flutter 9s ease-in-out infinite}

#garden .b1{left:180px;top:70px}

.card button.cb{position:absolute;display:block;border:0;padding:0;margin:0;background:none;cursor:pointer;border-radius:28px;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.card button.cb img{width:100%;height:100%;display:block;max-width:none}
.card button.cb:hover{transform:scale(1.04)}.card button.cb:active{transform:scale(.93)}.card button.cb:focus-visible{outline:4px solid #fff;outline-offset:3px}
#soonToast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:50;pointer-events:none;

@keyframes soon{12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
</style>
