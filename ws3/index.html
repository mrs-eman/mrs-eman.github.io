<title>Map 3 Worksheets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: a tab strip of four sheets; each sheet is one A4 "paper" that works with a finger on screen and prints as a clean worksheet.
   Single bright classroom look by choice (matches the My Alphabet maps). */
:root{
  color-scheme:light;
  --sky:#bfe6ff; --paper:#fffaf1; --ink:#2b2140; --muted:#7d6f92;
  --pink:#ff4f93; --pink-d:#d12d6f; --pink-l:#ffd3e6;
  --sun:#ffc928; --mint:#2fbf6b; --mint-l:#dcf7e8; --red:#ef3b3b; --line:#c9bde0;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --letter:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sky)}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--pink);outline-offset:3px}

/* logos on every sheet */
.logos{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 6px}
.logos img{display:block;width:min(200px,40%);height:auto;filter:drop-shadow(0 6px 8px rgba(40,70,140,.2))}
.tab.home{padding:8px 14px;text-decoration:none}.tab.home svg{width:24px;height:24px;display:block}

/* tabs */
.tabs{max-width:820px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tab{border:0;cursor:pointer;border-radius:999px;padding:8px 18px 9px;background:#fff;font-weight:800;font-size:17px;color:var(--muted);
  box-shadow:0 4px 0 #9cc9e8;display:flex;align-items:center;gap:8px}
.tab b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pink-l);color:var(--pink-d);font-size:16px}
.tab[aria-selected="true"]{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.tab[aria-selected="true"] b{background:#fff}
.tab .got{font-size:14px;color:inherit;opacity:.85;font-variant-numeric:tabular-nums}

/* paper */
.paper{position:relative;max-width:820px;margin:0 auto;background:var(--paper);border-radius:22px;padding:26px 26px 22px;
  box-shadow:0 12px 30px rgba(40,60,110,.18)}
.paper::before{content:"";position:absolute;inset:10px;border:3px dashed #ffb3d1;border-radius:16px;pointer-events:none}
.sheet[hidden]{display:none!important}
.head{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:flex-end;font-family:var(--letter);font-size:17px;color:var(--muted)}
.head .fill{display:inline-block;min-width:150px;border-bottom:2px solid var(--line);margin-left:6px}
.brand{font-family:var(--display);font-weight:800;color:var(--pink-d);font-size:15px;letter-spacing:.4px}
h1{margin:12px 0 2px;font:800 clamp(26px,5vw,38px)/1.1 var(--display);color:var(--ink);text-wrap:balance;display:flex;align-items:center;gap:10px}
h1 .no{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--sun);color:#6a3d00;font-size:26px}
.task{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font:400 clamp(17px,3.4vw,21px)/1.3 var(--letter)}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:var(--pink-l);display:grid;place-items:center}
.say svg{width:26px;height:26px}
.say.on{animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.foot{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;margin-top:18px;font-size:14px;color:var(--muted)}
.stars{display:flex;gap:2px}
.stars img{width:30px;height:30px;object-fit:contain;filter:grayscale(1) opacity(.3);transition:filter .3s,transform .3s}
.stars img.got{filter:none;transform:scale(1.12)}
.again{border:0;cursor:pointer;border-radius:999px;padding:6px 16px;background:#fff;box-shadow:0 3px 0 var(--line);font-weight:700;color:var(--muted);font-size:15px}
.pic{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}

/* sheet 1: match */
.match{position:relative;display:grid;grid-template-columns:1fr minmax(40px,1.4fr) 1fr;row-gap:10px}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.m-l,.m-r{display:flex;align-items:center;gap:10px;height:86px;cursor:pointer;touch-action:none}
.m-l{grid-column:1;justify-content:flex-end}
.m-r{grid-column:3;justify-content:flex-start}
.m-l .pbox{width:96px;height:80px}
.m-r .lbox{width:96px;height:72px;display:flex;align-items:center;justify-content:center;gap:2px}
.m-r .lbox{align-items:flex-end}
.m-r .lbox img{height:60px;width:auto;max-width:50px;object-fit:contain}
.m-r .lbox img+img{height:44px}
.dot{flex:none;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.m-r .wbox{font:700 clamp(28px,5.4vw,42px)/1 var(--letter);color:var(--ink);letter-spacing:.5px}
.wbox .w1,.word .w1{color:var(--red)}
.m-l.sel .dot,.m-r.sel .dot{background:var(--sun)}
/* sheet 5: listen and tick */
.orows{display:grid;gap:10px}
.orow{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));align-items:center;gap:10px;padding:6px;border-radius:18px;border:2px solid #f1e6f7;background:#fff;position:relative}
.lhead{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px}
.orow .n{font:700 18px var(--letter);color:var(--muted)}
.lsay{width:54px;height:54px}.lsay svg{width:32px;height:32px}
.obp{display:block;height:84px;transition:transform .2s}
.tickbox{display:block;width:40px;height:40px;margin:4px auto 0;border:3px solid var(--ink);border-radius:8px;background:#fff}
.tickbox svg{width:100%;height:100%}.tickbox path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;transition:stroke-dashoffset .35s}
.tickbox .tk{stroke:var(--mint)}.tickbox .xx{stroke:var(--red)}
.ob.ok .tk,.ob.no .xx{stroke-dashoffset:0}.ob.ok .tickbox{border-color:var(--mint)}
.tsays{display:none}
.ob{position:relative;border:0;background:none;cursor:pointer;padding:4px}
.orow.solved{border-color:var(--mint);background:var(--mint-l)}
.m-l.done .dot,.m-r.done .dot{background:var(--mint);border-color:var(--mint)}
.wrongflash{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* sheet 2: circle */
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.crow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:18px;background:#fff;border:2px solid #f1e6f7}
.crow .pbox{flex:none;width:84px;height:76px;cursor:pointer}
.crow .opts{flex:1;display:flex;justify-content:space-around}
.copt{position:relative;width:58px;height:66px;border:0;background:none;cursor:pointer;font:700 46px/1 var(--letter);color:var(--ink);padding:0}
.copt svg{position:absolute;left:-8px;top:-6px;width:74px;height:78px;pointer-events:none;overflow:visible}
.copt svg path{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset .45s ease}
.copt.mark svg path{stroke-dashoffset:0}
.copt.ok svg path{stroke:var(--mint)}
.copt.no svg path{stroke:var(--red)}
.crow.solved{border-color:var(--mint);background:var(--mint-l)}

/* sheet 3: trace */
.trows{display:grid;gap:12px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.model{display:flex;flex-direction:column;align-items:center;gap:2px;width:86px}
.model .lp{display:flex;align-items:flex-end;gap:2px;height:58px}
.model .lp img{height:56px;width:auto;max-width:42px;object-fit:contain}
.model .lp img+img{height:42px}
.model .w{display:flex;gap:4px}
.model .w button{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:var(--pink-l);display:grid;place-items:center}
.model .w button svg{width:20px;height:20px}
.tbox{position:relative;height:96px;border-radius:14px;background:#fff;border:2px solid #f1e6f7;overflow:hidden;touch-action:none}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%}
.tbox.done{border-color:var(--mint);background:var(--mint-l)}
.tbox .tick{position:absolute;right:8px;top:6px;width:30px;height:30px;opacity:0;transform:scale(.4);transition:.3s}
.tbox.done .tick{opacity:1;transform:none}

/* sheet 4: missing letter */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 10px;border-radius:18px;background:#fff;border:2px solid #f1e6f7}
.card .pbox{width:100%;height:92px;cursor:pointer}
.word{display:flex;align-items:flex-end;font:700 clamp(30px,6vw,40px)/1 var(--letter);color:var(--ink);letter-spacing:1px}
.blank{display:inline-grid;place-items:center;width:1.05em;height:1.15em;margin-right:2px;border-bottom:4px solid var(--ink);color:var(--pink-d);cursor:pointer;border-radius:6px 6px 0 0}
.blank.hover{background:#fff3c4}
.card.solved{border-color:var(--mint);background:var(--mint-l)}
.card.solved .blank{color:var(--mint);border-color:var(--mint)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;padding:12px;border-radius:18px;background:#fff6fb;border:2px dashed #ffc2dc}
.bank .lab{flex-basis:100%;text-align:center;font:400 16px var(--letter);color:var(--muted)}
.tile{width:60px;height:60px;border-radius:16px;border:0;cursor:grab;background:#fff;box-shadow:0 5px 0 #ffb3d1;font:700 40px/1 var(--letter);color:var(--pink-d);touch-action:none}
.tile.sel{background:var(--sun);color:#6a3d00;box-shadow:0 5px 0 #d9a300}
.tile.used{visibility:hidden}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1)}

/* cheer */
#cheer{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);opacity:0;z-index:60;pointer-events:none;
  display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:10px 26px 12px 14px;box-shadow:0 14px 40px rgba(160,30,90,.3);
  font:800 clamp(26px,6vw,44px)/1 var(--display);color:var(--pink)}
#cheer img{width:56px;height:56px;object-fit:contain}
#cheer.show{animation:cheer 1.6s cubic-bezier(.3,1.5,.6,1) forwards}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}30%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.wig{animation:wig .8s ease-in-out}
@keyframes wig{20%{transform:rotate(-8deg) scale(1.08)}45%{transform:rotate(7deg) scale(1.08)}70%{transform:rotate(-4deg)}100%{transform:none}}

@media (max-width:600px){
  .paper{padding:20px 16px 18px;border-radius:18px}
  .rows{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m-l .pbox{width:72px;height:64px}.m-r .wbox{font-size:26px}.obp{height:62px}.lsay{width:44px;height:44px}
  .m-l,.m-r{height:70px}
  .model{width:66px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print: every sheet on its own A4 page, no screen-only parts */
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff}
  body{padding:0}
  .tabs,.again,.say,.model .w,#cheer,.stars,.tick{display:none!important}
  .sheet[hidden]{display:block!important}
  .paper{box-shadow:none;max-width:none;break-after:page;border-radius:0;padding:14px 18px}
  .paper:last-child{break-after:auto}
  .crow,.card,.tbox{break-inside:avoid}
  .paper{display:flex;flex-direction:column;min-height:270mm;background:#fff}
  .paper::before{border-width:2px}
  .body{flex:1;display:flex;flex-direction:column;justify-content:space-around}
  h1{font-size:30px}.task{font-size:20px;margin-bottom:8mm}
  .match{row-gap:6mm}.m-l,.m-r{height:30mm}.m-l .pbox{width:42mm;height:30mm}
  .m-r .wbox{font-size:13mm}
  .dot{width:7mm;height:7mm;border-width:1.2mm}
  .rows{grid-template-columns:1fr;gap:4mm}.crow{padding:2mm 8mm;background:#fff}.crow .pbox{width:38mm;height:26mm}
  .copt{width:22mm;height:24mm;font-size:18mm}
  .trows{gap:5mm}.tbox{height:31mm}.model{width:34mm}.model .lp{height:22mm}.model .lp img{height:21mm;max-width:16mm}.model .lp img+img{height:15mm}
  .cards{gap:6mm}.card{padding:5mm 3mm}.card .pbox{height:46mm}.word{font-size:11mm}
  .orows{gap:2mm}.obp{height:17mm}.orow{padding:1mm 3mm}.tickbox{width:8mm;height:8mm;margin-top:1mm}
  .lsay{display:grid!important;width:12mm;height:12mm}
  .tsays{display:block;margin:4mm 0 0;font:400 13px var(--letter);color:var(--muted)}
  .bank{margin-top:8mm}.tile{width:20mm;height:20mm;font-size:13mm;box-shadow:none;border:2px solid #ffb3d1}
}
/* three sections */
.secs{max-width:820px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sec{border:0;cursor:pointer;border-radius:20px;padding:10px 24px 12px;background:#fff;font:800 clamp(20px,4vw,26px)/1 var(--display);color:var(--muted);box-shadow:0 5px 0 #9cc9e8}
.sec.c0[aria-selected="true"]{background:#ff4f93;color:#fff;box-shadow:0 5px 0 #d12d6f}
.sec.c1[aria-selected="true"]{background:#ffc928;color:#6a3d00;box-shadow:0 5px 0 #d9a300}
.sec.c2[aria-selected="true"]{background:#2f8be6;color:#fff;box-shadow:0 5px 0 #1d63ad}
.tab[hidden]{display:none!important}
.chip{display:inline-block;margin-top:10px;padding:4px 16px;border-radius:999px;font:800 16px var(--display);color:#fff}
.chip.c0{background:#ff4f93}.chip.c1{background:#1f9be8}.chip.c2{background:#a04fe0}
.secs{gap:6px;margin-bottom:4px}
.sec,.sec[aria-selected]{background:none!important;box-shadow:none!important;padding:0!important;border-radius:0}
.sec img{display:block;height:clamp(54px,9vw,82px);width:auto;transition:transform .25s,filter .25s,opacity .25s;opacity:.55;filter:saturate(.55)}
.sec[aria-selected="true"] img{opacity:1;filter:saturate(1) drop-shadow(0 6px 10px rgba(120,40,90,.3));transform:scale(1.08)}
.tabs{gap:14px;margin-bottom:12px}
.tab.kt,.tab.kt[aria-selected="true"]{background:none;box-shadow:none;padding:0;flex-direction:column;gap:0;color:var(--muted)}
.tab.kt img{display:block;height:clamp(84px,14vw,118px);width:auto;transition:transform .25s,filter .25s,opacity .25s;opacity:.6;filter:saturate(.6)}
.tab.kt[aria-selected="true"] img{opacity:1;filter:saturate(1) drop-shadow(0 6px 10px rgba(120,40,90,.3));transform:scale(1.08)}
.tab.kt .got{margin-top:-4px;background:#fff;border-radius:999px;padding:1px 10px;font:800 14px var(--display);color:var(--pink-d);box-shadow:0 2px 0 #ffd3e6}
.obl{display:grid;place-items:center;height:84px;font:700 64px/1 var(--letter);color:var(--ink)}
.rhead{display:flex;align-items:center;gap:8px;min-width:150px;padding:0 6px}.rhead .n{font:700 18px var(--letter);color:var(--muted)}
.rw{font:700 clamp(30px,5.5vw,42px)/1 var(--letter);color:var(--ink)}.rw .w1{color:var(--red)}
.bigL{font:700 clamp(46px,8vw,64px)/1 var(--letter);color:var(--ink);width:80px;text-align:center}
.srow{grid-template-columns:auto auto minmax(0,1fr)!important}.srow .n{font:700 18px var(--letter);color:var(--muted);padding-left:6px}
.spic{width:120px;height:90px}
.sopts{display:grid;gap:8px}
.sb{display:flex!important;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px!important;border-radius:14px!important;background:#fff6fb!important;border:2px solid #ffd3e6!important}
.stx{font:700 clamp(22px,4vw,30px)/1.2 var(--letter);color:var(--ink);text-align:left}
.sb .tickbox{margin:0;flex:none}
.bcards{grid-template-columns:repeat(2,minmax(0,1fr))}
.slots{display:flex;gap:6px;margin:4px 0}
.slot{display:grid;place-items:center;width:48px;height:54px;border-bottom:4px solid var(--ink);font:700 38px/1 var(--letter);color:var(--pink-d);cursor:pointer}
.bcard.solved .slot{color:var(--mint);border-color:var(--mint)}
.ltiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tile.st{width:50px;height:50px;font-size:32px}
.scards{grid-template-columns:repeat(2,minmax(0,1fr))}
.sline{font:700 clamp(22px,4vw,30px)/1.4 var(--letter);color:var(--ink);text-align:center}
.wblank{width:4.6em!important;height:1.3em!important;font-size:.9em;vertical-align:bottom}
.tile.wt{width:auto;padding:0 16px;font-size:28px}
.bank.top{margin:0 0 16px;position:sticky;top:6px;z-index:20;background:#fff6fb;box-shadow:0 8px 18px rgba(160,40,100,.18)}
.bank.top .tile.used{display:none}
.picking .wblank{background:#fff3c4;animation:bglow 1s ease-in-out infinite alternate}
@keyframes bglow{from{box-shadow:0 0 0 0 rgba(255,201,40,.0)}to{box-shadow:0 0 0 6px rgba(255,201,40,.55)}}
@media (max-width:600px){.bank.top{padding:8px;gap:6px}.bank.top .lab{font-size:13px}.tile.wt{font-size:22px;height:46px;padding:0 12px}}
.crow2{grid-template-columns:auto minmax(0,1fr)!important}
.crow2 .opts{display:flex;justify-content:space-around;position:relative;touch-action:none;cursor:crosshair}
.copt.pc{width:clamp(64px,24vw,120px);height:auto;aspect-ratio:6/5;flex:0 1 auto}.copt.pc .obp{display:block;height:84%;margin-top:8%}
.copt.pc svg{left:-5%;top:-4%;width:110%;height:108%}
.crow2 .opts svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.s3row{display:flex!important;flex-direction:column;align-items:stretch;gap:8px;padding:10px 8px!important}
.s3row .shead{justify-content:center;padding:4px 8px 0}
.s3row .stx{font-size:clamp(26px,4.8vw,36px)}
.s3row .opts{width:100%}
.orow,.opts{min-width:0}
.crow2{display:flex!important;flex-direction:column;align-items:stretch;gap:8px;padding:10px 8px!important}.crow2 .rhead,.crow2 .shead{justify-content:center;min-width:0;padding:4px 8px 0}.crow2 .rw{font-size:clamp(30px,5.4vw,40px)}.crow2 .opts{width:100%;justify-content:space-around}
.crow2.solved{border-color:var(--mint);background:var(--mint-l)}
.wmodel{width:120px}.wmodel .pbox{width:110px;height:80px}
.wtrow .tbox{height:110px}
.s2row{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)!important}
.shead{display:flex;align-items:center;gap:10px;padding:0 8px}.shead .n{font:700 18px var(--letter);color:var(--muted)}
.s2row .stx{font-size:clamp(24px,4.4vw,34px)}
@media (max-width:600px){.bcards,.scards{grid-template-columns:minmax(0,1fr)}.spic{width:80px;height:64px}.rhead{min-width:100px}.obl{height:62px;font-size:48px}}

    const gap=R.W/gs.length;let k2=1;ws.forEach(w=>{if(w>gap*0.9)k2=Math.min(k2,gap*0.9/w)});
    return items.map((it,k)=>({g:it.g,x:gap*k+gap/2,base,fs:it.fs*k2,low:it.low}))}
  function guides(ctx2,W,H){const {ys}=lines(H);ctx2.setLineDash([]);
    ys.forEach((y,i)=>{ctx2.strokeStyle=i===2?'#2b2b2b':'rgba(40,40,40,.32)';ctx2.lineWidth=i===2?Math.max(2,H/42):Math.max(1,H/95);ctx2.beginPath();ctx2.moveTo(0,y);ctx2.lineTo(W,y);ctx2.stroke()});
    layout(ctx2,H).forEach(it=>paint(ctx2,it,(o,g,x,b,fs)=>{o.fillStyle='rgba(160,140,205,.30)';o.fillText(g,x,b);
      o.setLineDash([fs/30,fs/24]);o.lineWidth=Math.max(1.6,fs/36);o.strokeStyle='#6f5fa0';o.strokeText(g,x,b);o.setLineDash([])}));}
  function draw(){const d=devicePixelRatio||1;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,R.W,R.H);guides(c,R.W,R.H);
    c.lineCap=c.lineJoin='round';c.strokeStyle='#ff4f93';c.lineWidth=R.H*0.075;
    R.strokes.forEach(s=>{c.beginPath();s.forEach(([u,v],k)=>{const x=u*R.W,y=v*R.H;k?c.lineTo(x,y):c.moveTo(x,y)});if(s.length===1)c.lineTo(s[0][0]*R.W+.1,s[0][1]*R.H);c.stroke()})}
  R.size=()=>{RAT=null;const r=box.getBoundingClientRect();if(!r.width)return;R.W=r.width;R.H=r.height;const d=devicePixelRatio||1;cv.width=Math.round(R.W*d);cv.height=Math.round(R.H*d);draw()};
  function check(){const S=0.5,W=Math.round(R.W*S),H=Math.round(R.H*S);if(W<10)return;
    const a=document.createElement('canvas');a.width=W;a.height=H;const x=a.getContext('2d');x.scale(S,S);layout(x,R.H).forEach(it=>paint(x,it,(o,g,px,b)=>{o.fillStyle='#000';o.fillText(g,px,b)}));
    const b=document.createElement('canvas');b.width=W;b.height=H;const y=b.getContext('2d');y.scale(S,S);y.lineCap=y.lineJoin='round';y.lineWidth=R.H*0.16;y.strokeStyle='#000';
    R.strokes.forEach(s=>{y.beginPath();s.forEach(([u,v],k)=>{k?y.lineTo(u*R.W,v*R.H):y.moveTo(u*R.W,v*R.H)});y.stroke()});
    const z=document.createElement('canvas');z.width=W;z.height=H;const q=z.getContext('2d');q.scale(S,S);q.lineJoin='round';q.lineWidth=R.H*0.22;q.strokeStyle=q.fillStyle='#000';
    layout(q,R.H).forEach(it=>paint(q,it,(o,g,px,b)=>{o.lineJoin='round';o.lineWidth=R.H*0.22;o.strokeStyle=o.fillStyle='#000';o.fillText(g,px,b);o.strokeText(g,px,b)}));
    const da=x.getImageData(0,0,W,H).data,db=y.getImageData(0,0,W,H).data,dz=q.getImageData(0,0,W,H).data;let tot=0,hit=0,ink=0,inside=0;
    for(let i=3;i<da.length;i+=4){if(da[i]>128){tot++;if(db[i]>128)hit++}if(db[i]>128){ink++;if(dz[i]>128)inside++}}
    let each=true;{const its0=layout(x,R.H),its=[];its0.forEach(it=>{if(it.g&&it.g.length>1){x.font=FONT(it.fs);const W0=x.measureText(it.g).width,x0=it.x-W0/2;it.g.split('').forEach((c,k)=>{if(!/[A-Za-z]/.test(c))return;its.push({g:c,x:x0+x.measureText(it.g.slice(0,k)).width+x.measureText(c).width/2,base:it.base,fs:it.fs,low:it.low})})}else its.push(it)});if(its.length>1)its.forEach(it=>{const c=document.createElement('canvas');c.width=W;c.height=H;const o2=c.getContext('2d');o2.scale(S,S);paint(o2,it,(o,g,px,bb)=>{o.fillStyle='#000';o.fillText(g,px,bb)});const dd=o2.getImageData(0,0,W,H).data;let t2=0,h2=0;for(let i=3;i<dd.length;i+=4){if(dd[i]>128){t2++;if(db[i]>128)h2++}}if(t2&&h2/t2<0.6)each=false})}
    if(tot&&each&&hit/tot>0.68&&inside/ink>0.6&&!R.done){try{window.__wsAct&&__wsAct(si,{tr:__wsPath(row),s:R.strokes})}catch(_){}R.done=true;box.classList.add('done');play(row.dataset.word?CLIP[row.dataset.word]:'n_'+l.toUpperCase());win(si,$('.lp,.pbox',row))}}
  let cur=null;
  box.addEventListener('pointerdown',e=>{unlock();box.setPointerCapture(e.pointerId);const r=box.getBoundingClientRect();cur=[[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]];R.strokes.push(cur);draw()});
  box.addEventListener('pointermove',e=>{if(!cur)return;const r=box.getBoundingClientRect();cur.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);draw()});
  const up=()=>{if(!cur)return;cur=null;check()};box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  $('.hear',row).onclick=e=>play(row.dataset.word?CLIP[row.dataset.word]:'n_'+l.toUpperCase(),e.currentTarget);
  $('.erase',row).onclick=()=>{R.strokes=[];draw()};
  const ro=new ResizeObserver(()=>R.size());ro.observe(box);R.off=()=>ro.disconnect();
  return R;
}

/* ===== WORDS ===== */
const picRow=(a,k,head,ds)=>`<div class="orow" data-ans="${a}">${head}${place(a,ds,k).map(w=>`<button class="ob" type="button" data-w="${w}" aria-label="${w}"><span class="obp">${pic(w)}</span>${TICK}</button>`).join('')}</div>`;
function buildWListen(body,si){
  const ans=shuffle(PLAN.w_listen);
  const pool=otherW();
  body.innerHTML=`<div class="orows">${ans.map((a,k)=>picRow(a,k,sayRow(k),[pool[2*k],pool[2*k+1]])).join('')}</div>`;
  wireTick(body,si,(row,el)=>play(CLIP[row.dataset.ans],el));
}
function hintCircle(b){b.classList.remove('hint');void b.offsetWidth;b.classList.add('hint');setTimeout(()=>b.classList.remove('hint'),1300)}
function drawCircles(opts,row,judge){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','ink');opts.appendChild(svg);
  let pts=null,path=null,id=null;
  const xy=e=>{const r=opts.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const size=()=>{const r=opts.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`)};
  opts.addEventListener('pointerdown',e=>{if(row.classList.contains('solved'))return;unlock();size();id=e.pointerId;try{opts.setPointerCapture(id)}catch(_){}
    pts=[xy(e)];path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','stroke');svg.appendChild(path);e.preventDefault()});
  opts.addEventListener('pointermove',e=>{if(!pts||e.pointerId!==id)return;const p=xy(e),q=pts[pts.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])<2)return;
    pts.push(p);path.setAttribute('d','M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L'))});
  const end=e=>{if(!pts||e.pointerId!==id)return;const P=pts,st=path;pts=null;
    if(P.length<8){st.remove();return}
    const r=opts.getBoundingClientRect();let hit=null,best=0;
    $$('.copt',opts).forEach(b=>{const q=b.getBoundingClientRect(),cx=q.left+q.width/2-r.left,cy=q.top+q.height/2-r.top;
      let sweep=0;for(let i=1;i<P.length;i++){let d=Math.atan2(P[i][1]-cy,P[i][0]-cx)-Math.atan2(P[i-1][1]-cy,P[i-1][0]-cx);
        if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;sweep+=d}
      sweep=Math.abs(sweep);if(sweep>best){best=sweep;hit=b}});
    if(hit&&best>=Math.PI*1.45)judge(hit,st);
    else{st.classList.add('fade');setTimeout(()=>st.remove(),600)}};
  opts.addEventListener('pointerup',end);opts.addEventListener('pointercancel',end)}

function circlePath(){const p=[];for(let k=0;k<=26;k++){const a=-1.9+k/26*Math.PI*2.15,rx=31+Math.sin(k*1.7)*1.5,ry=35+Math.cos(k*1.3)*1.5;p.push((k?'L':'M')+(37+Math.cos(a)*rx).toFixed(1)+' '+(39+Math.sin(a)*ry).toFixed(1))}return p.join(' ')}
function buildWRead(body,si){
  const ans=shuffle(PLAN.w_read);const pool=otherW();
  body.innerHTML=`<div class="orows">${ans.map((a,k)=>`<div class="orow crow2" data-ans="${a}"><div class="rhead"><span class="n">${k+1}</span><span class="rw">${redW(a)}</span></div><div class="opts">${place(a,[pool[2*k],pool[2*k+1]],k).map(w=>`<button class="copt pc" type="button" data-l="${w}" aria-label="${w}"><span class="obp">${pic(w)}</span><svg viewBox="0 0 74 78" preserveAspectRatio="none"><path d="${circlePath()}"/></svg></button>`).join('')}</div></div>`).join('')}</div>`;
  $$('.crow2',body).forEach(row=>{const ans=row.dataset.ans;
    const judge=(b,stroke)=>{if(row.classList.contains('solved'))return;try{window.__wsAct&&__wsAct(si,{j:__wsPath(b)})}catch(_){}
      if(b.dataset.l===ans){if(stroke)stroke.classList.add('ok');else b.classList.add('mark','ok');row.classList.add('solved');play(CLIP[ans]);win(si,$('.obp',b))}
      else{wsMiss(ans,b.dataset.l,row);boing();play('try');if(stroke){stroke.classList.add('no');setTimeout(()=>stroke.remove(),900)}else{b.classList.add('mark','no');setTimeout(()=>b.classList.remove('mark','no'),900)}}};
    $$('.copt',row).forEach(b=>b.onclick=e=>{if(e.detail===0)judge(b);else hintCircle(b)});
    drawCircles($('.opts',row),row,judge)});
}
function buildWWrite(body,si){
  TW.forEach(r=>r.off&&r.off());TW=[];
  const words=shuffle(PLAN.w_write);
  body.innerHTML=`<div class="trows">${words.map(w=>`<div class="trow wtrow" data-l="${WORDS[w]}" data-word="${w}"><div class="model wmodel"><div class="pbox">${pic(w)}</div>
    <div class="w"><button type="button" class="hear" aria-label="Hear ${w}">${spkSVG}</button><button type="button" class="erase" aria-label="Clear">${eraseSVG}</button></div></div>
    <div class="tbox"><canvas></canvas><img class="tick" alt="done"></div></div>`).join('')}</div>`;
  $$('.trow',body).forEach(row=>TW.push(tracer(row,si)));
  $$('.tick',body).forEach(t=>t.src=A.star);
  document.fonts&&document.fonts.load('400 80px Andika').then(()=>TW.forEach(r=>r.size()));
}
let TW=[];

/* ===== SENTENCES (only "This is ..." and "It is ...") ===== */
function buildSListen(body,si){
  const ans=shuffle(PLAN.s_listen);
  const pool=otherW();
  body.innerHTML=`<div class="orows">${ans.map((a,k)=>picRow(a,k,sayRow(k),[pool[2*k],pool[2*k+1]]).replace('class="orow"',`class="orow" data-s="${sent(a,k)}"`)).join('')}</div>`;
  wireTick(body,si,(row,el)=>{const k='sv_'+row.dataset.ans;if(A[k])play(k,el);else speak(row.dataset.s,el)});
}
function buildSRead(body,si){
  const ans=shuffle(PLAN.s_read);const pool=otherW();
  body.innerHTML=`<div class="orows">${ans.map((a,k)=>`<div class="orow crow2 s3row" data-ans="${a}" data-s="${sent(a,k)}"><div class="shead"><span class="n">${k+1}</span><span class="stx">${sent(a,k)}</span></div><div class="opts">${place(a,[pool[2*k],pool[2*k+1]],k).map(w=>`<button class="copt pc" type="button" data-l="${w}" aria-label="${w}"><span class="obp">${pic(w)}</span><svg viewBox="0 0 74 78" preserveAspectRatio="none"><path d="${circlePath()}"/></svg></button>`).join('')}</div></div>`).join('')}</div>`;
  $$('.crow2',body).forEach(row=>{const ans=row.dataset.ans;
    const judge=(b,stroke)=>{if(row.classList.contains('solved'))return;try{window.__wsAct&&__wsAct(si,{j:__wsPath(b)})}catch(_){}
      if(b.dataset.l===ans){if(stroke)stroke.classList.add('ok');else b.classList.add('mark','ok');row.classList.add('solved');win(si,$('.obp',b))}
      else{wsMiss(ans,b.dataset.l,row);boing();play('try');if(stroke){stroke.classList.add('no');setTimeout(()=>stroke.remove(),900)}else{b.classList.add('mark','no');setTimeout(()=>b.classList.remove('mark','no'),900)}}};
    $$('.copt',row).forEach(b=>b.onclick=e=>{if(e.detail===0)judge(b);else hintCircle(b)});
    drawCircles($('.opts',row),row,judge)});
}
function buildSWrite(body,si){
  const words=shuffle(PLAN.s_write);
  body.innerHTML=`<div class="bank top"><span class="lab">Tap a word, then tap the line ✨</span>${shuffle(words).map(w=>`<button class="tile wt" type="button" data-w="${w}">${w}</button>`).join('')}</div>
    <div class="cards scards">${words.map((w,k)=>`<div class="card scard" data-w="${w}" data-s="${sent(w,k)}"><div class="pbox" role="button" tabindex="0" aria-label="Picture">${pic(w)}</div>
    <div class="sline">${IT.has(w)?'It is':'This is'} ${art(w)} <span class="blank wblank" role="button" tabindex="0" aria-label="Missing word"></span>.</div></div>`).join('')}</div>`;
  let sel=null,drag=null;
  const place=(tile,card)=>{if(card.classList.contains('solved'))return;try{window.__wsAct&&__wsAct(si,{p:[__wsPath(tile),__wsPath(card)]})}catch(_){}
    if(tile.dataset.w===card.dataset.w){card.classList.add('solved');$('.blank',card).textContent=tile.dataset.w;tile.classList.add('used');tile.classList.remove('sel');sel=null;win(si,$('.pbox',card))}
    else{wsMiss(card.dataset.w,tile.dataset.w,card);nope(card)}};
  $$('.scard',body).forEach(card=>{card.onclick=()=>{if(sel)place(sel,card)}});
  const glow=()=>body.classList.toggle('picking',!!sel);body.addEventListener('click',()=>setTimeout(glow,0));
  $$('.tile',body).forEach(t=>{
    t.addEventListener('click',()=>{if(drag&&drag.moved)return;$$('.tile.sel',body).forEach(x=>x.classList.remove('sel'));sel=t;t.classList.add('sel');play(CLIP[t.dataset.w])});
    t.addEventListener('pointerdown',e=>{unlock();drag={t,x:e.clientX,y:e.clientY,moved:false,g:null};t.setPointerCapture(e.pointerId)});
    t.addEventListener('pointermove',e=>{if(!drag||drag.t!==t)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
      if(!drag.moved){drag.moved=true;drag.g=t.cloneNode(true);drag.g.classList.add('ghost');document.body.appendChild(drag.g);t.style.opacity=.3}
      drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
      $$('.blank',body).forEach(b=>{const r=b.getBoundingClientRect();b.classList.toggle('hover',e.clientX>r.left-20&&e.clientX<r.right+20&&e.clientY>r.top-20&&e.clientY<r.bottom+20)})});
    const end=()=>{if(!drag||drag.t!==t)return;const d=drag;t.style.opacity='';if(d.g)d.g.remove();
      const hb=$$('.blank.hover',body)[0];$$('.blank',body).forEach(b=>b.classList.remove('hover'));
      if(d.moved&&hb)place(t,hb.closest('.card'));setTimeout(()=>{drag=null},0)};
    t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  });
}

.wsRes .wb{font-family:WB}
.wsRes{position:relative;width:min(720px,100%);margin:4px auto 12px;animation:wsPop .8s cubic-bezier(.3,1.6,.5,1) both}
.wsRes.stp{position:relative;height:0;width:100%;margin:0;animation:none;z-index:40;pointer-events:none}
.wsRes.stp .wsStamp{position:absolute;top:-6px;left:50%;width:min(270px,64%);height:auto;margin-left:calc(min(270px,64%) / -2);transform:rotate(-8deg);filter:drop-shadow(0 8px 12px rgba(80,40,90,.35));animation:wsStampIn .65s cubic-bezier(.2,1.25,.4,1) both}
@keyframes wsStampIn{0%{transform:rotate(-24deg) scale(2.5);opacity:0}50%{opacity:1}70%{transform:rotate(-7deg) scale(.9)}85%{transform:rotate(-8.5deg) scale(1.04)}100%{transform:rotate(-8deg) scale(1);opacity:1}}
@keyframes wsPop{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
@keyframes wsSwing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media print{.wsRes,#wsName{display:none!important}}
#wsName{position:fixed;inset:0;z-index:200;background:rgba(60,30,80,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#wsName .wnc{background:#fff0f7;border:6px solid #ff4f93;border-radius:32px;padding:26px 30px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 16px 40px rgba(150,30,90,.3)}
#wsName h3{margin:0;font:800 32px var(--display);color:#c52468}
#wsName input{font:700 28px var(--display);padding:10px 16px;border:3px dashed #ffa6c9;border-radius:18px;width:100%;box-sizing:border-box;background:#fff;color:#2b2140;text-align:center}
#wsName .wcl{display:flex;align-items:center;gap:8px;font:800 28px var(--display);color:#c52468}#wsName .wcl input{width:90px}
#wsName button{font:800 28px var(--display);border:0;border-radius:999px;padding:10px 36px;background:#ff4f93;color:#fff;box-shadow:0 5px 0 #c52468;cursor:pointer}#wsName button:disabled{opacity:.45}

<script>
/* result banner: Mrs Eman's design as the picture, the score drawn on top */
const WSC={1:['#e8187f','#ff8cc6','#ffc2de'],2:['#e26a00','#ffae52','#ffd3a3'],3:['#1460d6','#45b1f5','#b3e1ff'],4:['#129a3a','#7ccd4f','#b4ebaa'],5:['#7438d6','#b385ff','#ddc9ff']};
const WSBOX={champ:[575,190,1190,540],great:[615,215,1235,530],good:[440,160,1125,540]};
function wsBanner(got,nn,map,T){
  const [D,L]=WSC[map]||WSC[1];const full=got===nn,mid=!full&&got>=Math.ceil(nn/2),kind=full?'champ':(mid?'great':'good');
  const b=WSBOX[kind],W=b[2]-b[0],H=b[3]-b[1],id='n'+Math.random().toString(36).slice(2,7);
  const t=(s,size,c1,c2,cls)=>{const g=id+cls;return `<g class="${cls}"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".18" stop-color="${c2}"/><stop offset=".6" stop-color="${c1}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>`+
    `<text x="0" y="0" font-size="${size}" class="wb" fill="none" stroke="#fff" stroke-width="${size*.17}" stroke-linejoin="round" filter="url(#${id}sh)">${s}</text>`+
    `<text x="0" y="0" font-size="${size}" class="wb" fill="url(#${g})" stroke="${c1}" stroke-width="${size*.035}" stroke-linejoin="round">${s}</text></g>`};
  const svg=`<svg class="wsNum" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="position:absolute;left:${b[0]/21.72}%;top:${b[1]/7.24}%;width:${W/21.72}%;height:${H/7.24}%;overflow:visible">
<defs><filter id="${id}sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".16"/></filter></defs>
<g class="all">${t(String(got),300,D,L,'a')}${t('/',230,L,L,'s')}${t(String(nn),270,L,L,'b')}</g></svg>`;
  return `<img src="${T[kind]}" alt="" style="width:100%;height:auto;display:block">${svg}`;
}
function wsFit(el){const s=el.querySelector('svg.wsNum');if(!s)return;try{
  const vb=s.viewBox.baseVal,q=c=>s.querySelector(c);let x=0;
  ['.a','.s','.b'].forEach((c,k)=>{const g=q(c),bb=g.getBBox();g.setAttribute('transform',`translate(${x-bb.x},${k===1?-8:0})`);x+=bb.width+(k===1?-4:-2)});

.tile.back{transition:left .25s,top .25s}
.w-pic{width:150px;height:110px}

.skyset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 16px;padding:18px 8px 10px;border-radius:28px;background:linear-gradient(#dff2ff,#f3faff 70%,#fff)}

.balloons{display:flex;gap:6px;margin-top:-6px}

.bln.no{animation:shake .4s;filter:grayscale(.6)}

.blocks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px auto 22px;padding:14px 18px;width:fit-content;border-radius:18px;background:#8a5a3b;box-shadow:inset 0 -6px 0 #6e452c,0 6px 12px rgba(80,40,20,.25)}
.blocks .tile,.tile.t3{width:62px;height:62px;border-radius:12px;border:0;display:grid;place-items:center;font:700 40px/1 var(--letter);color:#fff;background:var(--bc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}

.polas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px;padding:10px 4px}
.pola{position:relative;background:#fff;border:5px solid var(--pc);border-radius:22px;padding:0;overflow:visible;display:flex;flex-direction:column;box-shadow:0 6px 12px rgba(60,30,80,.10)}
.pola::before{content:"";position:absolute;left:50%;top:-14px;width:76px;height:24px;transform:translateX(-50%);background:var(--pc);border-radius:8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.pola .ph{width:100%!important;align-self:stretch;margin:0!important;box-sizing:border-box;height:150px;border-radius:17px 17px 0 0;background:var(--pbg);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:2px solid rgba(0,0,0,.06)}

.lined{display:flex;justify-content:center;align-items:center;gap:0;width:100%;box-sizing:border-box;padding:12px 6px 14px;background:#fff;border-radius:0 0 17px 17px;font:700 clamp(30px,4.6vw,44px)/1 var(--letter);color:#1d1b5c;letter-spacing:.5px}
.lined .hole{margin-right:6px;width:56px!important;height:52px!important;padding:0!important;border-radius:12px;border:3px dashed #e8579a;background:#fff;display:grid;place-items:center;color:#e0262b;transition:transform .15s,background .15s}

.pola.solved .hole{margin-right:0;border:0;background:none;width:auto!important;height:auto!important;min-width:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.pola.solved{box-shadow:0 0 0 4px var(--mint),0 6px 12px rgba(60,30,80,.10)}

.town{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 22px;padding:22px 12px 26px;border-radius:28px;background:linear-gradient(#eaf7ff 0 78%,#d9f3d6 78%)}
.house{position:relative;display:flex;flex-direction:column;align-items:center}
.roof{position:relative;width:184px;height:84px;display:flex;justify-content:center;align-items:flex-end}
.roof::before{content:'';position:absolute;inset:0;background:var(--hc);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:6px}

.wall{width:160px;padding:14px 10px 0;background:#fffdf7;border:3px solid var(--hc);border-top:0;border-radius:0 0 14px 14px;display:flex;justify-content:space-between;gap:6px}

.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px;padding:20px 10px 24px;border-radius:28px}

.opt{position:relative;border:0;cursor:pointer;font:700 34px/1 var(--letter);color:var(--ink)}
.opt svg{position:absolute;left:50%;top:50%;width:68px;height:76px;transform:translate(-50%,-50%) rotate(-8deg);overflow:visible;pointer-events:none}
.opt svg path{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset .55s}

.cat .hd::before{left:28px;transform:rotate(-18deg)}.cat .hd::after{right:28px;transform:rotate(18deg)}

/* C ice cream */
.v-ice{background:linear-gradient(#fff4fa,#fff)}
.ice{display:flex;flex-direction:column;align-items:center}
.ice .scoops{display:flex;gap:4px;margin-bottom:-14px;z-index:1}

.ice .cone{width:118px;height:120px;background:repeating-linear-gradient(45deg,#f2b36b 0 10px,#e59c4f 10px 12px),#f2b36b;clip-path:polygon(0 0,100% 0,50% 100%);display:flex;justify-content:center;padding-top:20px}
.ice .cone img{height:48px;width:auto;filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)}
@media (max-width:640px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.v-cat{grid-template-columns:1fr!important}}

.sky2{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 18px;padding:16px 10px 20px;border-radius:28px;background:linear-gradient(#dff2ff,#f5fbff)}

.balloon .tag{position:absolute;top:78.5%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--bc);background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer;font:700 clamp(22px,3.4vw,34px)/1 var(--letter);color:var(--ink);padding:0;display:grid;place-items:center}
.balloon .tag svg{position:absolute;left:50%;top:50%;width:140%;height:140%;transform:translate(-50%,-50%) rotate(-8deg);overflow:visible;pointer-events:none}

.balloon .tag.ok svg path{stroke-dashoffset:0}.balloon .tag span{display:inline-block}.balloon .tag.no{color:var(--red)}.balloon .tag.no span{animation:shake .4s}

@keyframes floatUp{0%{transform:none}40%{transform:translateY(-14px)}100%{transform:translateY(-6px)}}

.sw2{gap:14px!important;margin:6px 0 14px!important}
