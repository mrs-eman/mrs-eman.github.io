<style>
/* Layout: the teacher's "Let's Read" poster fills the screen; live word parts sit in its empty boxes, a word card opens on top. */
:root{
  --sky:#bfe6ff; --ink:#2b2140; --paper:#ffffff; --muted:#7a6f8c; --pink:#ff4f93; --gold:#ffc21a;
  --read:"Andika","Comic Sans MS","Trebuchet MS",sans-serif;
  --ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#backdrop{position:fixed;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(26px) saturate(1.15);transform:scale(1.05)}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,calc((100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.5*.95));aspect-ratio:1.5;max-width:100%;
  container-type:inline-size;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden}
#world{position:absolute;inset:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.45,.05,.35,1);will-change:transform}
#world>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.zone{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:3cqw;z-index:3}
.zone:focus-visible{outline:.35cqw solid var(--pink);outline-offset:-.6cqw}
#stage.zoomed .zone{display:none}
.lhot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:2cqw;pointer-events:none}#stage.zoomed .lhot{pointer-events:auto}.lhot.say{animation:pop .5s ease}

#credit{position:absolute;left:50%;bottom:-.2cqw;transform:translateX(-50%);z-index:3;width:30cqw;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 .2cqw .4cqw rgba(0,0,0,.18));transition:opacity .3s}
#stage:not(.zoomed) .hot,#stage:not(.zoomed) .box{pointer-events:none}
#back{position:absolute;left:1cqw;top:9.6cqw;z-index:4;width:11.5cqw;aspect-ratio:323/320;border:0;padding:0;background:none;cursor:pointer;
  display:block;transition:opacity .4s;filter:drop-shadow(0 .5cqw .8cqw rgba(43,33,64,.3))}
#back .house{position:absolute;inset:0;width:100%;height:100%;display:block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 .25cqw .4cqw rgba(120,40,120,.25))}
#back img{position:absolute;display:block}
#back .hb{inset:0;width:100%;height:100%}
#back .hh{animation:beat 1.2s ease-in-out infinite;transform-origin:50% 60%}
#back .hr{animation:shine 1.2s ease-in-out infinite alternate}
#back .r0{transform-origin:100% 50%}#back .r1{transform-origin:0 50%;animation-delay:.6s}
#back:active .house{transform:scale(.92)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6%) rotate(3deg)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1.05)}45%{transform:scale(1.2)}}
@keyframes shine{from{transform:scale(.85);opacity:.7}to{transform:scale(1.2);opacity:1}}


.hot,.box{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;font:inherit;color:inherit}
.hot{border-radius:1.2cqw}
.hot:focus-visible,.box:focus-visible,.cbtn:focus-visible,.nav:focus-visible{outline:.35cqw solid var(--pink);outline-offset:.2cqw}
.box{display:flex;align-items:center;justify-content:center;border-radius:1cqw}
.box:active{transform:scale(.97)}
.chips{display:flex;align-items:baseline;gap:.5cqw;font:700 2.6cqw/1 var(--read)}
.chip{padding:0;background:none;text-shadow:0 .14cqw 0 rgba(0,0,0,.22),0 .3cqw .4cqw rgba(0,0,0,.12)}
.chips.long{gap:.28cqw;font-size:2.3cqw}.chips.long .chip{padding:0}
.hot.say{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.06)}}

/* a word built from syllables -> sound units -> letters */
.wd{position:relative;display:inline-flex;align-items:flex-start;gap:.55em;font-family:var(--read);font-weight:700;line-height:1;padding-bottom:.55em}
.syl{position:relative;display:inline-flex;border-radius:.25em;padding:.04em .06em;transition:background .2s,transform .2s}
.syl+.syl::before{display:none;content:"";position:absolute;width:.16em;height:.16em;border-radius:50%;background:var(--muted);opacity:.55;left:-.36em;top:.42em}
.ch{position:relative;display:inline-block;transition:color .15s,transform .15s}
.wd .mk{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mk circle,.mk path{transition:fill .15s,stroke .15s}
.syl.lit{background:color-mix(in srgb,var(--c) 18%,transparent);transform:translateY(-.06em)}
.ch.lit{transform:translateY(-.12em) scale(1.08)}

/* word card */
#card{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,33,64,.32);z-index:5}
#card[hidden]{display:none!important}
.panel{position:relative;width:78cqw;max-width:100%;background:var(--paper);border-radius:3cqw;padding:2.6cqw 3cqw 2.4cqw;
  box-shadow:0 1.4cqw 4cqw rgba(43,33,64,.3);outline:.35cqw dashed color-mix(in srgb,var(--c) 55%,#fff);outline-offset:-1.2cqw;
  display:grid;grid-template-columns:22cqw 1fr;gap:2.4cqw;align-items:center}
.panel .pic{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 .6cqw .8cqw rgba(43,33,64,.18))}
.panel .right{min-width:0;display:flex;flex-direction:column;align-items:center;gap:1.6cqw}
.panel .big{font-size:9.4cqw}
.meta{display:flex;gap:1.2cqw;align-items:center;font-size:1.7cqw;font-weight:700;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--c);font-size:2.1cqw}
.sep{width:.5cqw;height:.5cqw;border-radius:50%;background:var(--muted);opacity:.6}
.claps{display:inline-flex;gap:.5cqw}.claps i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--c);display:block}
.sbtn{border:0;background:none;padding:0;cursor:pointer;width:24cqw;-webkit-tap-highlight-color:transparent}.sbtn img{display:block;width:100%}.sbtn:active{transform:translateY(.4cqw)}.sbtn:focus-visible{outline:.35cqw solid var(--pink);outline-offset:.3cqw;border-radius:99cqw}
.btns{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}
.cbtn{display:inline-flex;align-items:center;gap:.8cqw;border:0;cursor:pointer;border-radius:99cqw;padding:.9cqw 1.7cqw;
  font:800 1.95cqw/1 var(--ui);color:#fff;background:var(--c);box-shadow:0 .5cqw 0 color-mix(in srgb,var(--c) 70%,#000)}
.cbtn.alt{background:#fff;color:var(--c);box-shadow:inset 0 0 0 .3cqw var(--c),0 .5cqw 0 color-mix(in srgb,var(--c) 40%,#fff)}
.cbtn:active{transform:translateY(.4cqw);box-shadow:none}
.cbtn svg{width:2.4cqw;height:2.4cqw}
.close{position:absolute;right:1.6cqw;top:1.4cqw;width:4.4cqw;height:4.4cqw;border-radius:50%;border:0;background:#fff;cursor:pointer;
  box-shadow:0 .3cqw 1cqw rgba(43,33,64,.25);display:grid;place-items:center}
.close svg{width:2.2cqw;height:2.2cqw}
.nav{position:absolute;top:50%;width:5cqw;height:5cqw;margin-top:-2.5cqw;border-radius:50%;border:0;background:#fff;cursor:pointer;
  box-shadow:0 .3cqw 1cqw rgba(43,33,64,.25);display:grid;place-items:center}
.nav svg{width:2.6cqw;height:2.6cqw}
.nav.prev{left:-2.5cqw}.nav.next{right:-2.5cqw}
#cheer{position:absolute;left:50%;top:7%;transform:translate(-50%,-30%) scale(.6);opacity:0;pointer-events:none;z-index:9;
  background:#fff;border-radius:99cqw;padding:.8cqw 2.4cqw;font:800 3cqw/1.1 var(--ui);color:var(--pink);display:flex;gap:1cqw;align-items:center;
  box-shadow:0 .8cqw 2cqw rgba(43,33,64,.25)}
#cheer img{width:3.6cqw}
#cheer.show{animation:cheer 1.8s ease forwards}
@keyframes cheer{15%{opacity:1;transform:translate(-50%,0) scale(1.05)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10%)}}
.corner{position:absolute;top:1.4cqw;display:flex;gap:1cqw;z-index:4}
.corner a{display:grid;place-items:center;width:5cqw;height:5cqw;border-radius:50%;background:#fff;box-shadow:0 .3cqw 1cqw rgba(43,33,64,.25)}
.corner a svg{width:2.8cqw;height:2.8cqw}
#fx{position:absolute;inset:0;pointer-events:none}
#fx img{position:absolute;display:block;will-change:transform}
#fx .fl{transform-origin:50% 130%;animation:sway 2.8s ease-in-out infinite alternate}
#fx .sun{transform-origin:50% 50%;animation:sun 3s ease-in-out infinite alternate}
#fx .bfw,#fx .fly{position:absolute}
#fx .bfw{animation:hover 5s ease-in-out infinite alternate}
#fx .fly{animation:fly 32s ease-in-out infinite}
#fx .wing{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;animation:wing 1.2s ease-in-out infinite}
@keyframes sway{from{transform:rotate(-14deg) scale(.94)}to{transform:rotate(14deg) scale(1.1)}}
@keyframes sun{from{transform:rotate(-10deg) scale(.92)}to{transform:rotate(10deg) scale(1.12)}}
@keyframes wing{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.6)}}
@keyframes hover{from{transform:translate(0,0) rotate(-6deg)}to{transform:translate(-8%,10%) rotate(6deg)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-10deg)}25%{transform:translate(-300%,90%) rotate(8deg)}50%{transform:translate(-700%,30%) rotate(-6deg)}75%{transform:translate(-380%,-60%) rotate(10deg)}}
.meta{display:none!important}</style>

function zoomTo(i){const [x,y,w,h]=PANELS[i],s=Math.min(PW/w,PH/h)*.9,X=((PW-s*w)/2-s*x)/PW*100,Y=((PH-s*h)/2-s*y)/PH*100;
  world.style.transform=`translate(${X}%,${Y}%) scale(${s})`;stage.classList.add('zoomed');zoomedAt=i;run++;stop();}

/* ---------- word card ---------- */
const card=$('#card'),big=$('#cardWord'),panel=$('.panel');let at=0,run=0,seen=new Set();
function openCard(n){at=(n+W.length)%W.length;const d=W[at];run++;stop();
  panel.style.setProperty('--c',COL[d.l]);$('.pic',panel).src=A['p_'+d.w];$('.pic',panel).alt=d.w;
  $('.claps',panel).innerHTML='<i></i>'.repeat(d.u.length);$('.nsnd',panel).textContent=d.u.length;
  card.hidden=false;const wd=build(big,d);wd.classList.add('big');{const P=panel.getBoundingClientRect(),lim=P.right-P.width*.09;let f=9.4;wd.style.fontSize=f+'cqw';while(f>4&&wd.getBoundingClientRect().right>lim){f-=.3;wd.style.fontSize=f+'cqw'}}
  $$('.ch',wd).forEach(ch=>ch.onclick=()=>{const i=+ch.dataset.i,k=d.u.findIndex(u=>u.includes(i));sound(k)});
  
  $('.close',panel).focus({preventScroll:true});play('w_'+d.w)}
async function sound(k){const my=++run,d=W[at];clearAll(big);lightUnit(big,k,true);await play('snd_'+d.snd[k]);if(my===run)lightUnit(big,k,false)}
async function syll(k){const my=++run,d=W[at];clearAll(big);lightSyl(big,k,true);await play(d.syl.length>1?'syl_'+d.syl[k]:'w_'+d.w);if(my===run)lightSyl(big,k,false)}
async function doSyl(){const my=++run,d=W[at];clearAll(big);
  for(let k=0;k<d.syl.length;k++){if(my!==run)return;lightSyl(big,k,true);await play(d.syl.length>1?'syl_'+d.syl[k]:'w_'+d.w,650);await wait(160);lightSyl(big,k,false)}}
/* sounds in order; after a chunk of several sounds, its blended chunk is heard (as in the teacher's recordings) */
function chunkOf(d,i){let n=0;for(let k=0;k<d.syl.length;k++){n+=d.syl[k].length;if(i<n)return k}return d.syl.length-1}
async function doSnd(){const my=++run,d=W[at];clearAll(big);
  for(let c=0;c<d.syl.length;c++){
    for(let k=0;k<d.u.length;k++){if(chunkOf(d,d.u[k][0])!==c)continue;if(my!==run)return;
      lightUnit(big,k,true);await play('snd_'+d.snd[k],560);await wait(120);if(my!==run)return;lightUnit(big,k,false)}
    if(d.bl[c]){if(my!==run)return;lightSyl(big,c,true);await play('snd_'+d.bl[c],600);await wait(160);if(my!==run)return;lightSyl(big,c,false)}}
  /* then the whole word, in the same go */
  if(my!==run)return;await wait(220);if(my!==run)return;
  for(let k=0;k<d.u.length;k++)lightUnit(big,k,true);
  await play('w_'+d.w);if(my!==run)return;clearAll(big);
  if(!seen.has(d.w)){seen.add(d.w);cheer()}}
async function doRead(){const my=++run,d=W[at];clearAll(big);
  for(let k=0;k<d.u.length;k++){if(my!==run)return;lightUnit(big,k,true);await wait(170)}
  await play('w_'+d.w);if(my!==run)return;clearAll(big);
  if(!seen.has(d.w)){seen.add(d.w);cheer()}}
