#mouth{will-change:transform}
#girlBox{position:absolute;inset:0;will-change:transform;pointer-events:none}
.slide{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;

.slide.on{opacity:1;visibility:visible;transition:opacity .3s ease .9s, visibility 0s}
.slide > *{position:absolute;pointer-events:auto}
.slide:not(.on) > *{pointer-events:none}
.hot{cursor:pointer;border-radius:50%}
.zone{cursor:pointer}
.slide img{display:block;-webkit-user-drag:none}
.letter{cursor:pointer}
.letter.bounce{animation:bounce .7s ease}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.08) translateY(-3%)}70%{transform:scale(.97)}100%{transform:scale(1)}}

.spk:active{transform:scale(.92)}
.spk.playing{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.home{cursor:pointer;transition:transform .15s}
.home:active{transform:scale(.94)}
.hot:focus-visible,.zone:focus-visible,.spk:focus-visible,.home:focus-visible,.letter:focus-visible{outline:4px solid #fff;outline-offset:2px}

  src.start(); return src;
}
function startMusic(){ if(music) return; music=true;  }
let sayToken=0;
async function say(name,spk,animal,obj){
  if(!unlocked){unlock(false);}
  const my=++sayToken;
  if(current){try{current.stop();}catch(e){} }
  document.querySelectorAll('.spk.playing').forEach(s=>s.classList.remove('playing'));
  const src=await play(name); if(my!==sayToken){try{src.stop();}catch(e){} return;} current=src;
  if(spk) spk.classList.add('playing');
  src.onended=()=>{
    if(spk) spk.classList.remove('playing');
    if(!animal||my!==sayToken) return;
    // after the word, the animal answers with its own voice
    setTimeout(async()=>{
      if(my!==sayToken) return;
      const a=await play('fx_'+animal,{gain:ANIMAL_GAIN[animal]||.85}); if(my!==sayToken){try{a.stop();}catch(e){} return;}
      current=a; if(obj) restart(obj,'wiggle');
    },180);
  };
}
const ANIMAL_GAIN={insect:.6,tiger:.75,ant:1};
async function girlSpeak(){
  if(!ctx) return;
  if(girlSrc){try{girlSrc.stop();}catch(e){}}
  girlSrc=await play('girl',{toAnalyser:true});
  talking=true; lastVoice=performance.now();

}
function unlock(greet){
  initAudio(); if(ctx.state!=='running') ctx.resume();
  if(unlocked) return; unlocked=true;
  startMusic(); if(greet) girlSpeak();
}

/* ---------- lip-sync loop ---------- */
let talking=false, open=1, data=null, lastVoice=0, env=0;
function lip(t){
  let target=1, speaking=false;
  if(talking&&analyser){
    data=data||new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(data);
    let s=0; for(let i=0;i<data.length;i++) s+=data[i]*data[i];
    const rms=Math.sqrt(s/data.length);
    if(rms>.012) lastVoice=t;
    speaking=(t-lastVoice)<250;
    if(speaking){ target=Math.min(1,Math.max(0,(rms-.012)/.09)); target=.2+target*.8; }
  }
  if(speaking) skin.classList.add('on');
  open+= (target-open)*(target>open?.5:.3);
  if(!speaking && open>.97){ open=1; skin.classList.remove('on'); }
  mouth.style.transform='rotate('+(document.documentElement.classList.contains("isboy")?0:M.ang)+'deg) scaleY('+open.toFixed(3)+') rotate('+(-(document.documentElement.classList.contains("isboy")?0:M.ang))+'deg)';

  env+=((speaking?1:0)-env)*(speaking?.08:.04);

  const rot=amp*(2.4*Math.sin(sec*2*Math.PI*.85)+1.2*Math.sin(sec*2*Math.PI*2.1))+ (1-open)*0 + amp*(open-.3)*1.6;
  const dy=amp*(-.35*Math.abs(Math.sin(sec*2*Math.PI*1.7)) - (open-.3)*.25);
  girlBox.style.transform='translateY('+dy.toFixed(3)+'%) rotate('+rot.toFixed(3)+'deg)';
  requestAnimationFrame(lip);
}
requestAnimationFrame(lip);

/* ---------- navigation ---------- */
let cur=-1;
function go(i,instant){
  if(i===cur||i<0||i>=SLIDES.length) return;
  const s=SLIDES[i], b=s.bg;
  const T='translate('+pct(b[0],SW)+','+pct(b[1],SH)+') scale('+(b[2]/SW)+')';
  [world,worldTop].forEach(w=>{w.style.transition=instant?'none':'';w.style.transform=T;});
  document.querySelectorAll('.stl').forEach(e=>{e.style.transition='opacity .3s '+(i===0?'.6s':'.6s');e.style.opacity=i===0?1:0});
  layers.forEach((L,j)=>{L.classList.toggle('on',j===i); if(L._high) L._high.classList.toggle('on',j===i);});
  sayToken++; if(current){try{current.stop();}catch(e){} current=null;}
  if(girlSrc&&i!==0){try{girlSrc.stop();}catch(e){} }
  const first=cur===-1; cur=i;
  if(!ctx||!unlocked) return;
  if(i===0) girlSpeak(); else if(s.click) play('click');

go(0,true);

/* first touch anywhere wakes the sound up (browsers block sound until then) */
stage.addEventListener('pointerdown',e=>{
  if(unlocked) return;
  const pick=e.target.closest&&e.target.closest('.hot,.home,.spk,.zone,.letter,a,button');
  const onHome=cur===0&&!pick;
  unlock(onHome);
  if(onHome){ e.stopPropagation(); swallow=true; }
},true);
let swallow=false;
stage.addEventListener('click',e=>{ if(swallow){ swallow=false; e.stopPropagation(); e.preventDefault(); } },true);
addEventListener('keydown',e=>{
  if(e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&(e.key==='Enter'||e.key===' ')) return;
  const k=e.key; let n=null;
  if(k==='ArrowRight'||k==='PageDown'||k===' ') n=Math.min(cur+1,SLIDES.length-1);
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace') n=Math.max(cur-1,0);
  else if(k==='Home'||k==='Escape') n=0; else if(k==='End') n=SLIDES.length-1;
  if(n===null) return; e.preventDefault();
  if(!unlocked){unlock(false);} go(n);
});
/* try to start sound right away (works where the browser allows it) */
try{initAudio(); ctx.resume().then(()=>{ if(ctx.state==='running'&&!unlocked){unlock(cur===0);} }).catch(()=>{});}catch(e){}
document.addEventListener('visibilitychange',()=>{ if(!ctx) return; if(document.hidden) ctx.suspend(); else if(unlocked) ctx.resume(); });
</script>
