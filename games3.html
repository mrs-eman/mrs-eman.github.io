<title>Letter Fun Games M F D G O</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Comic+Neue:wght@700&display=swap">
<style>
/* Layout: one fixed 1200x800 "toy box" stage, scaled to fit any iPad/phone, over the map's own garden. Single bright look by choice. */
:root{
  --sky:#7cc6f2; --ink:#4a2a6b; --cream:#fff8ec; --pink:#ff4f93; --pink-d:#d12d6f;
  --sun:#ffd23f; --sun-d:#e9a700; --mint:#3ccf7a; --mint-d:#1f9b55; --lilac:#9b6bff;
  --font:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#back{position:fixed;inset:0;background:linear-gradient(#cfeeff,#e3f5ff 50%,#d9f2ff)}
#stage{position:absolute;left:50%;top:50%;width:1200px;height:800px;transform-origin:0 0;overflow:hidden;border-radius:28px;
  box-shadow:0 18px 60px rgba(40,30,90,.35)}
#garden{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 60% 40% at 80% 8%,rgba(255,240,200,.85),rgba(255,240,200,0) 70%),linear-gradient(#ffd6ea 0%,#f0dcff 32%,#d9ecff 62%,#e6f7ff 76%,#d8f3c8 88%)}
#garden .rainbow{position:absolute;left:290px;top:190px;width:620px;height:620px;border-radius:50%;opacity:.35;clip-path:inset(0 0 50% 0);
  background:radial-gradient(circle,transparent 56%,#ff6b6b 56.5% 59%,#ffa94d 59% 61.5%,#ffe066 61.5% 64%,#69db7c 64% 66.5%,#4dabf7 66.5% 69%,#9775fa 69% 71.5%,transparent 72%)}
#garden .cl{position:absolute;filter:drop-shadow(0 10px 12px rgba(180,120,200,.22))}
#garden .cl svg{display:block;width:100%;height:auto}
#garden .c1{left:-260px;top:70px;width:250px;animation:sail 48s linear infinite}
#garden .c2{left:-260px;top:210px;width:190px;animation:sail 62s linear infinite;animation-delay:-30s;opacity:.95}
#garden .c3{left:-260px;top:20px;width:160px;animation:sail 55s linear infinite;animation-delay:-14s;opacity:.9}
#garden .c4{left:-260px;top:330px;width:140px;animation:sail 70s linear infinite;animation-delay:-50s;opacity:.85}
@keyframes sail{from{transform:translateX(0)}to{transform:translateX(1500px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(70px)}}
#garden .sun{position:absolute;right:-90px;top:-100px;width:375px;animation:sunsway 6s ease-in-out infinite;transform-origin:50% 52%}
@keyframes sunsway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.05)}}
#garden .bf{position:absolute;width:52px;animation:flutter 9s ease-in-out infinite}
#garden .bf img,#g3 .flyer img{width:150%;margin:-25% 0 0 -25%;animation:none}
@keyframes flap{to{transform:scaleX(.45)}}
#garden .b1{left:180px;top:70px}#garden .b2{right:120px;top:360px;width:38px;animation-duration:11s;animation-direction:reverse}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(60px,-30px) rotate(6deg)}50%{transform:translate(20px,30px)}75%{transform:translate(-50px,0) rotate(-12deg)}}
#garden .meadow{position:absolute;left:-161px;bottom:0;width:1522px;height:175px;animation:breeze 7s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breeze{0%,100%{transform:skewX(0)}50%{transform:skewX(-1.2deg)}}
#garden .grassimg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 -3px 4px rgba(40,110,40,.25))}
#garden .fl{position:absolute}
@keyframes fsway{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(10deg) scale(1.07)}}
#garden .sun{filter:drop-shadow(0 0 18px rgba(255,214,80,.75))}
#garden .spark{position:absolute;width:22px;height:22px;background:radial-gradient(circle,#fff 0 20%,rgba(255,255,255,0) 60%);animation:twk 2.4s ease-in-out infinite}
#garden .spark::before,#garden .spark::after{content:"";position:absolute;left:10px;top:0;width:2px;height:22px;background:linear-gradient(transparent,#fff,transparent)}
#garden .spark::after{transform:rotate(90deg)}
#garden .s1{left:150px;top:300px}#garden .s2{left:980px;top:180px;animation-delay:-.8s}#garden .s3{left:620px;top:90px;animation-delay:-1.5s}#garden .s4{left:1080px;top:470px;animation-delay:-2s}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
#garden .rainbow{animation:rbw 5s ease-in-out infinite}
@keyframes rbw{0%,100%{opacity:.4}50%{opacity:.62}}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
img{max-width:none;-webkit-user-drag:none;user-select:none}

/* --- bubbly 3D buttons --- */
.btn{position:absolute;border:0;cursor:pointer;font:800 40px/1 var(--font);color:#fff;letter-spacing:.5px;
  background:linear-gradient(#ff7fb3,var(--pink) 55%,#f03c84);border-radius:999px;padding:18px 54px 22px;
  box-shadow:0 10px 0 var(--pink-d),0 18px 24px rgba(160,30,90,.35),inset 0 4px 0 rgba(255,255,255,.5);
  text-shadow:0 3px 0 rgba(150,20,80,.45);transition:transform .12s}
.btn:active{transform:translateY(6px);box-shadow:0 4px 0 var(--pink-d),0 8px 14px rgba(160,30,90,.3),inset 0 4px 0 rgba(255,255,255,.5)}
.btn.sun{background:linear-gradient(#ffe57a,var(--sun) 55%,#ffc21a);color:#7a3d00;text-shadow:0 2px 0 rgba(255,255,255,.6);
  box-shadow:0 10px 0 var(--sun-d),0 18px 24px rgba(160,110,0,.3),inset 0 4px 0 rgba(255,255,255,.6)}
.btn.sun:active{box-shadow:0 4px 0 var(--sun-d),inset 0 4px 0 rgba(255,255,255,.6)}
.btn.mint{background:linear-gradient(#7debaa,var(--mint) 55%,#2fbe6b);box-shadow:0 10px 0 var(--mint-d),0 18px 24px rgba(20,120,60,.3),inset 0 4px 0 rgba(255,255,255,.5);text-shadow:0 3px 0 rgba(10,90,40,.4)}
.btn.mint:active{box-shadow:0 4px 0 var(--mint-d),inset 0 4px 0 rgba(255,255,255,.5)}
.btn:focus-visible,.card:focus-visible,.round:focus-visible,.opt:focus-visible{outline:5px solid #fff;outline-offset:4px}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* round icon buttons (home, sound) */
.round{position:absolute;width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffd6ea 19%,#ff8cc0 70%,#f2559a);
  box-shadow:0 7px 0 var(--pink-d),0 12px 18px rgba(150,30,90,.3);display:grid;place-items:center;transition:transform .12s}
.round:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pink-d)}
.round svg{width:48px;height:48px}
a.round{text-decoration:none;z-index:30}

/* top bar */
.starbar{position:absolute;right:210px;top:22px;height:78px;padding:0 26px 0 14px;border-radius:999px;background:var(--cream);
  border:4px dashed #ffb3d1;outline:6px solid #fff;display:flex;align-items:center;gap:6px;
  box-shadow:0 10px 22px rgba(80,40,120,.2);font:800 42px/1 var(--font);color:var(--pink);z-index:20}
.starbar img{width:64px;height:auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.starbar.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.dots{position:absolute;left:50%;top:40px;transform:translateX(-50%);display:flex;gap:12px;z-index:5}
.dots i{width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid #ffc6de;box-shadow:0 3px 6px rgba(0,0,0,.12)}
.dots i.done{background:radial-gradient(circle at 35% 30%,#fff7b0,#ffd23f 60%,#f2a900);border-color:#fff}
.dots i.now{border-color:var(--pink);transform:scale(1.25)}

/* the guide girl + speech bubble */
.guide{position:absolute;left:-14px;bottom:-14px;width:340px;z-index:6;pointer-events:none;transform-origin:50% 100%}
.guide.talk{animation:none}
@keyframes talk{to{transform:translateY(-6px) rotate(-1.5deg) scale(1.02)}}
.bubble{position:absolute;left:18px;bottom:262px;max-width:300px;background:#fff;border-radius:34px;padding:14px 24px 16px;
  font:700 36px/1.12 "Comic Sans MS","Comic Neue","Chalkboard SE","Comic Sans",cursive;color:var(--ink);box-shadow:0 10px 24px rgba(70,40,120,.2);z-index:7;text-wrap:balance}
.bubble::before{content:"";position:absolute;left:70px;bottom:-22px;border:14px solid transparent;border-top:22px solid #fff;border-bottom:0}
.bubble:empty{display:none}

/* dashed "map card" plate, the signature look of the map */
.plate{position:absolute;background:var(--cream);border-radius:46px;box-shadow:0 14px 30px rgba(80,40,120,.22),inset 0 -8px 0 rgba(0,0,0,.04)}
.plate::before{content:"";position:absolute;inset:12px;border-radius:36px;border:4px dashed var(--dash,#ffa6c9);pointer-events:none}

/* --- title --- */
#title .gtitle{position:absolute;left:50%;top:6px;height:420px;width:auto;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 12px 16px rgba(80,40,120,.25))}
#title .sub{position:absolute;left:0;right:0;top:436px;text-align:center;font:800 46px/1 var(--font);color:#ff4f93;-webkit-text-stroke:8px #fff;paint-order:stroke fill;
  text-shadow:0 4px 0 var(--lilac),0 8px 16px rgba(80,40,140,.35);letter-spacing:1px}
#title .lfg{position:absolute;left:50%;top:424px;height:84px;width:auto;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 6px 8px rgba(80,40,120,.22))}
#title .letters{position:absolute;left:0;right:0;top:516px;display:flex;justify-content:center;gap:16px}
#title .letters img{height:86px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.15)) drop-shadow(0 0 0 #fff);animation:hop 2.4s ease-in-out infinite}
#title .letters{align-items:center;gap:12px}
#title .letters img.tlimg{height:92px;width:auto;max-width:none;filter:drop-shadow(0 6px 6px rgba(40,60,120,.2));animation:bob 3s ease-in-out infinite}
#title .tdash{width:34px;height:16px;border-radius:999px;flex:none;background:linear-gradient(#fff 0 12%,#ff4f93 32%,#c52468);box-shadow:0 0 0 3px #fff,0 4px 4px rgba(80,30,90,.25)}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-22px) rotate(-6deg)}90%{transform:translateY(0)}}
#title .btn{left:0;right:0;margin:auto;width:max-content;top:620px}
#startBtn{position:absolute;left:0;right:0;margin:auto;top:604px;width:330px;padding:0;border:0;background:none;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent}
#startBtn .pbimg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(150,30,90,.3));transition:transform .12s}
#startBtn:active .pbimg{transform:scale(.93)}
#startBtn:focus-visible{outline:4px solid #fff;outline-offset:4px;border-radius:40px}
#title .guide{width:390px}

/* --- menu --- */
#menu .starbar{right:40px}
#menu h1 .ctitle{height:74px;width:auto;max-width:none;display:inline-block;filter:drop-shadow(0 6px 6px rgba(150,40,100,.18))}
#menu h1{position:absolute;left:0;right:0;top:36px;margin:0;text-align:center;font:800 64px/1 var(--font);color:#ff4f93;-webkit-text-stroke:10px #fff;paint-order:stroke fill;
  text-shadow:0 5px 0 var(--pink),0 10px 20px rgba(160,30,90,.35)}
.cards{position:absolute;left:0;right:0;top:150px;display:flex;gap:26px;justify-content:center}
.card{position:relative;width:282px;height:420px;border:0;padding:0;cursor:pointer;background:none;font-family:var(--font);transition:transform .15s}
.card .plate{inset:0}
.card:active{transform:scale(.96)}
.card .num{position:absolute;left:18px;top:14px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  font:800 40px/1 var(--font);color:#fff;background:var(--c);border:6px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.12);z-index:2}
.card .art{position:absolute;left:0;right:0;top:56px;height:200px;display:grid;place-items:center}
.card .name{position:absolute;left:10px;right:10px;top:262px;text-align:center;font:800 34px/1.05 var(--font);color:var(--c);text-wrap:balance}
.card .stars{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:4px}
.card .stars img{width:62px;filter:grayscale(1) brightness(1.25) opacity(.45)}
.card .stars img.got{filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.card.c1{--c:#ff4f93;--dash:#ffa6c9}.card.c2{--c:#ff8a00;--dash:#ffc77a}.card.c3{--c:#2f8be6;--dash:#9fd0ff}
#menu .guide{width:330px}

/* --- game 1: listen & choose --- */
.navs{position:absolute;left:330px;bottom:4px;display:flex;gap:12px;z-index:7}
.navArr{width:82px;height:82px;border:0;padding:0;background:none;cursor:pointer;transition:transform .12s,opacity .2s;filter:drop-shadow(0 6px 6px rgba(150,30,90,.28))}
.navArr img{width:100%;height:100%;object-fit:contain;display:block}
.navArr:active{transform:scale(.9)}
.navArr.off{opacity:.35;pointer-events:none}
#g1 .stagecard{left:455px;top:104px;width:330px;height:330px;border-radius:50%;--dash:#ffa6c9}
#g1 .stagecard::before{border-radius:50%}
#g1 .spk{position:absolute;left:500px;top:170px;width:240px;cursor:pointer;filter:drop-shadow(0 8px 8px rgba(160,30,90,.25));transition:transform .12s}
#g1 .spk:active{transform:scale(.92)}
.spk.playing{animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.opts{position:absolute;left:300px;right:40px;top:490px;display:flex;justify-content:center;gap:34px}
.opt{position:relative;width:220px;height:220px;border:0;padding:0;cursor:pointer;background:none;transition:transform .15s}
.opt .plate{inset:0;border-radius:50px}
.opt .pair{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:42px}
.opt .pair img{filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.opt .pic{position:absolute;inset:22px;width:calc(100% - 44px);height:calc(100% - 44px);object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
.opt:active{transform:scale(.95)}
.opt.right .plate{background:#eafff1;box-shadow:0 0 0 10px #57e08f,0 14px 30px rgba(20,140,70,.35)}
.opt.wrong{animation:shake .5s}
.opt.popbox{animation:popin .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes shake{20%,60%{transform:translateX(-14px) rotate(-3deg)}40%,80%{transform:translateX(14px) rotate(3deg)}}
.wiggle{animation:wiggle .9s ease-in-out}
@keyframes wiggle{15%{transform:rotate(-9deg) scale(1.08)}32%{transform:rotate(8deg) scale(1.08)}50%{transform:rotate(-6deg) scale(1.05)}68%{transform:rotate(4deg)}100%{transform:none}}

/* --- game 2: match --- */
#g2 .tray{position:absolute;left:330px;right:30px;top:118px;height:250px;display:flex;justify-content:center;gap:40px}
.piece{position:relative;width:230px;height:230px;touch-action:none;cursor:grab;z-index:4}
.piece .plate{inset:0;border-radius:44px;--dash:#c8b4ff}
.piece img{position:absolute;left:20px;top:16px;width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));pointer-events:none}
.piece.drag{z-index:50;cursor:grabbing;transition:none}
.piece.drag .plate{box-shadow:0 26px 40px rgba(60,30,120,.35)}
.piece.home{transition:transform .45s cubic-bezier(.3,1.5,.6,1)}
.piece.placed{visibility:hidden}
#g2 .goals{position:absolute;left:330px;right:30px;top:440px;display:flex;justify-content:center;gap:40px}
.goal{position:relative;width:230px;height:250px}
.goal .plate{inset:0;border-radius:50px}
.goal .word{position:absolute;left:0;right:0;top:34px;text-align:center;font:800 50px/1 var(--font);color:#1f1a2e;letter-spacing:.5px}
.goal .word .w1{color:#e8191e}
.goal.wrong{animation:shake .5s}
.goal .slot{position:absolute;left:50%;bottom:22px;width:150px;height:120px;transform:translateX(-50%);border-radius:28px;background:rgba(255,255,255,.7);border:4px dashed #e2d2ff}
.goal .slot img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;animation:popin .45s cubic-bezier(.3,1.6,.6,1)}

function stopVoice(){vtoken++;if(voice){try{voice.stop()}catch(e){}voice=null}$$('.guide').forEach(g=>g.classList.remove('talk'));$$('.spk').forEach(s=>s.classList.remove('playing'))}
async function say(names,{talk=true,el=null}={}){ // play clips in sequence; resolves when done
  if(!ctx)return; stopVoice(); const my=vtoken; names=[].concat(names);
  const g=$('.screen.on .guide'); if(music)music.gain.setTargetAtTime(.08,ctx.currentTime,.1);
  for(const n of names){ if(my!==vtoken)return; const s=await playBuf(n); if(!s)continue; voice=s;

function tone(f,t0,d,type='sine',v=.25,f2){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,ctx.currentTime+t0+d);
  g.gain.setValueAtTime(0,ctx.currentTime+t0);g.gain.linearRampToValueAtTime(v,ctx.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t0+d);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t0);o.stop(ctx.currentTime+t0+d+.05);}
const fx={
 ding(){if(!ctx)return;[1046,1318,1568].forEach((f,i)=>tone(f,i*.08,.5,'triangle',.18))},
 boing(){if(!ctx)return;tone(220,0,.35,'sine',.3,120);tone(330,0,.25,'triangle',.1,160)},
 pop(){if(!ctx)return;const n=ctx.sampleRate*.12,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
   const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.frequency.value=1400;g.gain.value=1.1;s.buffer=b;s.connect(f);f.connect(g);g.connect(ctx.destination);s.start();tone(900,0,.12,'sine',.15,300)},
 tap(){if(!ctx)return;tone(660,0,.08,'sine',.12,880)},
 twinkle(){if(!ctx)return;[1568,1760,2093,2637].forEach((f,i)=>tone(f,i*.06,.35,'sine',.12))},
 fanfare(){if(!ctx)return;[[523,0],[659,.14],[784,.28],[1046,.42],[784,.62],[1046,.76]].forEach(([f,t])=>{tone(f,t,.35,'triangle',.2);tone(f/2,t,.35,'sine',.08)})},
 whoosh(){if(!ctx)return;tone(300,0,.3,'sine',.08,900)}
};

/* ===== Game 1: Listen & Choose =====
   Only the speaker is shown. A round says either a letter name (choose the letter)
   or a word (choose its picture). 12 rounds: every letter once, one word for every letter. */
let g1q=[],g1i=0,g1lock=false,g1max=0,g3max=0,navTok=0;
let g2max=0;
function navSt(n){return n===1?[g1i,g1max,g1q.length]:n===2?[g2i,g2max,g2r.length]:[g3i,g3max,g3list.length]}
function navUpd(n){const [i,mx,len]=navSt(n);$('#g'+n+' .navArr.prev').classList.toggle('off',i<=0);$('#g'+n+' .navArr.next').classList.toggle('off',i>=mx||i>=len-1);}
function navGo(n,d){const [c,mx,len]=navSt(n),i=c+d;
  if(i<0||i>mx||i>=len)return;navTok++;fx.whoosh();
  if(n===1){g1i=i;g1round(false);}else if(n===2){g2i=i;g2round();}else{g3i=i;g3item();}}
function g1(){
  const lettersQ=shuffle(LET).map(L=>({type:'letter',L}));
  const wordsQ=shuffle(LET).map(L=>{const j=Math.random()<.5?0:1;return {type:'word',L,j,w:L.w[j]}});
  g1q=[];for(let k=0;k<LET.length;k++){g1q.push(lettersQ[k],wordsQ[k]);}
  g1i=0;g1max=0;setBubble('Listen and choose!');g1round(true);
}
function g1clip(q){return q.type==='letter'?'n_'+q.L.k:wordClip(q.L,q.j)}
function g1round(first){
  g1lock=false;const q=g1q[g1i];dots(g1q.length,g1i);navUpd(1);
  const box=$('#g1 .opts');box.innerHTML='';
  let opts;
  if(q.type==='letter'){opts=shuffle([q.L,...shuffle(LET.filter(x=>x!==q.L)).slice(0,2)]).map(L=>({L,key:L.k}));}
  else{const pool=LET.flatMap(L=>L.w.map((w,j)=>({L,w,j}))).filter(p=>p.w!==q.w&&p.L!==q.L);
       opts=shuffle([{L:q.L,w:q.w,key:q.w},...shuffle(pool).slice(0,2).map(p=>({L:p.L,w:p.w,key:p.w}))]);}
  opts.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.type='button';
    b.style.setProperty('--dash',['#ffa6c9','#ffc77a','#9fd0ff'][k]);
    if(q.type==='letter'){b.setAttribute('aria-label','Letter '+o.L.k);b.innerHTML=`<div class="plate"></div><div class="pair">${pairHTML(o.L,120)}</div>`;}
    else{b.setAttribute('aria-label',o.w);b.innerHTML=`<div class="plate"></div><img class="pic" src="${A['o_'+o.w]}" alt="">`;}
    b.onclick=()=>g1pick(o,b);box.appendChild(b);restart(b,'popbox');});
  const spk=$('#g1 .spk');spk.onclick=()=>say(g1clip(q),{el:spk});
  say(first?['g1',g1clip(q)]:[g1clip(q)],{el:spk});
}
async function g1pick(o,b){
  if(g1lock)return;const q=g1q[g1i];
  const ok=q.type==='letter'?o.L===q.L:o.w===q.w;
  if(!ok){mistakes++;fx.boing();restart(b,'wrong');say('try');return;}
  g1lock=true;const tk=navTok;g1max=Math.max(g1max,g1i+1);navUpd(1);b.classList.add('right');fx.ding();flyStar(b);
  const pic=b.querySelector('.pic');if(pic)restart(pic,'wiggle');
  await say([praise()]);await wait(500);
  if(cur!=='g1'||tk!==navTok)return;
  g1i++; if(g1i<g1q.length){fx.whoosh();g1round(false)} else finish();
}

/* ===== Game 2: Match the Picture (drag) ===== */
let g2r=[],g2i=0,g2left=0;
const wordHTML=w=>`<span class="w1">${w[0]}</span>${w.slice(1)}`;
function g2(){
  // 4 quiet rounds x 3 pictures: every one of the 12 words, matched picture -> written word
  const all=shuffle(LET.flatMap(L=>L.w.map((w,j)=>({L,w,j}))));
  g2r=[[0,3],[3,6],[6,8],[8,10]].map(([a,b])=>all.slice(a,b));
  g2i=0;g2max=0;setBubble('Match each picture to its word!');g2round();
}
function g2round(){
  dots(g2r.length,g2i);navUpd(2);const set=g2r[g2i];g2left=set.length;
  const tray=$('#g2 .tray'),goals=$('#g2 .goals');tray.innerHTML='';goals.innerHTML='';
  shuffle(set).forEach(p=>{const d=document.createElement('div');d.className='piece';d.innerHTML=`<div class="plate"></div><img src="${A['o_'+p.w]}" alt="${p.w}">`;d._p=p;tray.appendChild(d);drag(d);});
  shuffle(set).forEach((p,k)=>{const g=document.createElement('div');g.className='goal';g.style.setProperty('--dash',['#ffa6c9','#ffc77a','#9fd0ff'][k]);
    g.innerHTML=`<div class="plate"></div><div class="word" style="${p.w.length>6?'font-size:40px;top:40px':''}">${wordHTML(p.w)}</div><div class="slot"></div>`;g._w=p.w;goals.appendChild(g);});
}
function drag(el){
  let sx,sy,on=false,ox=0,oy=0;
  el.addEventListener('pointerdown',e=>{if(el.classList.contains('placed'))return;unlock();on=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;el.classList.remove('home');el.classList.add('drag');fx.tap();});
  el.addEventListener('pointermove',e=>{if(!on)return;const s=stage._s;ox=(e.clientX-sx)/s;oy=(e.clientY-sy)/s;el.style.transform=`translate(${ox}px,${oy}px) scale(1.06) rotate(${Math.max(-8,Math.min(8,ox/30))}deg)`;
    const g=goalAt(e.clientX,e.clientY);$$('#g2 .goal').forEach(x=>x.classList.toggle('hover',x===g));});
  const end=e=>{if(!on)return;on=false;el.classList.remove('drag');$$('#g2 .goal').forEach(x=>x.classList.remove('hover'));
    const g=goalAt(e.clientX,e.clientY);
    if(g&&g._w===el._p.w&&!g.classList.contains('yes')){place(el,g)}
    else{ if(g){mistakes++;fx.boing();restart(g,'wrong');} el.classList.add('home');el.style.transform='';}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function goalAt(x,y){return $$('#g2 .goal').find(g=>{const r=g.getBoundingClientRect();return x>r.left&&x<r.right&&y>r.top&&y<r.bottom})}
async function place(el,g){
  say([praise()]);
  el.classList.add('placed');el.style.transform='';g.classList.add('yes');
  const im=document.createElement('img');im.src=A['o_'+el._p.w];g.querySelector('.slot').appendChild(im);
  fx.ding();flyStar(g);g2left--;
  if(g2left===0&&cur==='g2'){const tk=navTok;g2max=Math.max(g2max,g2i+1);navUpd(2);await wait(700);cheer('You are a star!');await wait(1100);if(cur!=='g2'||tk!==navTok)return;g2i++;if(g2i<g2r.length){fx.whoosh();g2round()}else finish();}
}

/* ===== Game 3: Trace the Letter =====
