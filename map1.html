<title>My Alphabet Part 1</title>
<style>
:root{--edge:#7cc6f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge:#7cc6f2}}
:root[data-theme="dark"]{--edge:#7cc6f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--edge);touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#backdrop{position:fixed;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;
  filter:blur(28px) saturate(1.2) brightness(.95);transform:scale(1.05)}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.25);background:#fdeef5}
#world,#worldTop{position:absolute;inset:0;transform-origin:0 0;will-change:transform;
  transition:transform .9s cubic-bezier(.45,.05,.35,1)}
#world img,#worldTop img{position:absolute;display:block;-webkit-user-drag:none;user-select:none}
#worldTop{pointer-events:none}
#bg{left:0;top:0;width:100%;height:100%}
.obj{transform-origin:50% 92%;pointer-events:none}
.wiggle{animation:wiggle .9s ease-in-out}
@keyframes wiggle{
  0%{transform:rotate(0) scale(1)}
  15%{transform:rotate(-9deg) scale(1.08)}
  32%{transform:rotate(8deg) scale(1.08)}
  50%{transform:rotate(-6deg) scale(1.06)}
  68%{transform:rotate(4deg) scale(1.04)}
  84%{transform:rotate(-2deg) scale(1.02)}
  100%{transform:rotate(0) scale(1)}}
#mouthskin{opacity:0;transition:opacity .12s}
#mouthskin.on{opacity:1}
#mouth{will-change:transform}
#girlBox{position:absolute;inset:0;will-change:transform;pointer-events:none}
.slide{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .2s ease, visibility 0s linear .2s}
.slide.on{opacity:1;visibility:visible;transition:opacity .3s ease .9s, visibility 0s}
.slide > *{position:absolute;pointer-events:auto}
.slide:not(.on) > *{pointer-events:none}
.hot{cursor:pointer;border-radius:50%}
.zone{cursor:pointer}
.slide img{display:block;-webkit-user-drag:none}
.letter{cursor:pointer}
.letter.bounce{animation:bounce .7s ease}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.08) translateY(-3%)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.spk{cursor:pointer;transition:transform .15s}
.spk:active{transform:scale(.92)}
.spk.playing{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.home{cursor:pointer;transition:transform .15s}
.home:active{transform:scale(.94)}
.hot:focus-visible,.zone:focus-visible,.spk:focus-visible,.home:focus-visible,.letter:focus-visible{outline:4px solid #fff;outline-offset:2px}
</style>

let ctx=null, unlocked=false, buffers={}, current=null, music=null, analyser=null, girlSrc=null;
const b64=s=>{const bin=atob(s.split(',')[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;};

  if(!buffers[name]) buffers[name]=new Promise((res,rej)=>ctx.decodeAudioData(b64(A['s_'+name]),res,rej));
  return buffers[name];
}
function initAudio(){
  if(ctx) return;

  ['girl','click'].forEach(getBuf);
}

  const buf=await getBuf(name); const src=ctx.createBufferSource(); src.buffer=buf; src.loop=loop;
  const g=ctx.createGain(); g.gain.value=gain; src.connect(g); g.connect(toAnalyser?analyser:ctx.destination);

}

async function say(name,spk,animal,obj){

  document.querySelectorAll('.spk.playing').forEach(s=>s.classList.remove('playing'));
  const src=await play(name); if(my!==sayToken){try{src.stop();}catch(e){} return;} current=src;
  if(spk) spk.classList.add('playing');
  src.onended=()=>{

    if(!animal||my!==sayToken) return;
    // after the word, the animal answers with its own voice
    setTimeout(async()=>{
      if(my!==sayToken) return;
      const a=await play('fx_'+animal,{gain:ANIMAL_GAIN[animal]||.85}); if(my!==sayToken){try{a.stop();}catch(e){} return;}
      current=a; if(obj) restart(obj,'wiggle');

}

/* ---------- lip-sync loop ---------- */
let talking=false, open=1, data=null, lastVoice=0, env=0;
function lip(t){
  let target=1, speaking=false;
  if(talking&&analyser){
    data=data||new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(data);
    let s=0; for(let i=0;i<data.length;i++) s+=data[i]*data[i];
    const rms=Math.sqrt(s/data.length);
    if(rms>.012) lastVoice=t;
    speaking=(t-lastVoice)<650;
    if(speaking){ target=Math.min(1,Math.max(0,(rms-.012)/.09)); target=.3+target*.7; }
  }
  if(speaking) skin.classList.add('on');
  open+= (target-open)*(target>open?.5:.3);
  if(!speaking && open>.97){ open=1; skin.classList.remove('on'); }
  mouth.style.transform='rotate('+M.ang+'deg) scaleY('+open.toFixed(3)+') rotate('+(-M.ang)+'deg)';
  // head: sways and nods while she talks, then settles back
  env+=((speaking?1:0)-env)*(speaking?.08:.04);
  const sec=t/1000, amp=env;
  const rot=amp*(2.4*Math.sin(sec*2*Math.PI*.85)+1.2*Math.sin(sec*2*Math.PI*2.1))+ (1-open)*0 + amp*(open-.3)*1.6;
  const dy=amp*(-.35*Math.abs(Math.sin(sec*2*Math.PI*1.7)) - (open-.3)*.25);
  girlBox.style.transform='translateY('+dy.toFixed(3)+'%) rotate('+rot.toFixed(3)+'deg)';
  requestAnimationFrame(lip);
}
